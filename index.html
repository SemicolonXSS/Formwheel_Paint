<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Paint</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><link rel="apple-touch-icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-apple-touch-icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#121626;color:#f2f1ff;font:15px system-ui}button,input{font:inherit}button{background:#303958;color:#fff;border:1px solid #4b5578;border-radius:10px;padding:10px;cursor:pointer}button.active,.primary{background:#6953db}button:hover{filter:brightness(1.2)}header{background:#1b2035;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}h1{font-size:22px;margin:0}a{color:#c9bdff}.app{display:grid;grid-template-columns:218px 1fr;gap:12px;padding:12px;max-width:1600px;margin:auto}.panel{border:1px solid #38415b;background:#1b2137;border-radius:16px;padding:12px}h2{color:#b5bad4;font-size:13px;margin:7px 0 12px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tools button{font-size:13px}label{display:block;margin:14px 0 5px;font-size:13px}input[type=range],input[type=color]{width:100%}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0}.swatches button{padding:0;height:28px}.main{min-width:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.stage{padding:15px;min-height:400px;display:flex;align-items:center;justify-content:center;border-radius:15px;background:#252c44;background-image:radial-gradient(#454d6d 1px,transparent 1px);background-size:17px 17px;overflow:auto}canvas{width:100%;height:auto;max-width:1000px;background:white;box-shadow:0 10px 30px #0006;touch-action:none;cursor:crosshair}.hint{color:#bac1db;font-size:12px}input[type=number]{width:76px;background:#151b2c;color:white;border:1px solid #4b5578;border-radius:7px;padding:6px}
@media(max-width:700px){.app{display:flex;flex-direction:column}.tools{grid-template-columns:repeat(4,1fr)}.stage{padding:8px;min-height:270px}.actions button{font-size:12px;padding:8px}h1{font-size:18px}}
</style></head><body><header><h1 style="display:flex;align-items:center"><img src="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg" alt="" style="width:28px;height:28px;vertical-align:middle;margin-right:8px;flex:none">🎨 Formwheel Paint</h1><a href="https://semicolonxss.github.io/Formwheel/">← Hub</a></header><div class="app"><aside class="panel"><h2>그리기 도구</h2><div class="tools" id="tools"><button data-tool="pen" class="active">✏️ 펜</button><button data-tool="eraser">🧽 지우개</button><button data-tool="line">／ 직선</button><button data-tool="rect">▭ 사각형</button><button data-tool="circle">◯ 원</button><button data-tool="fill">🪣 채우기</button><button data-tool="text">T 글자</button><button data-tool="pick">💧 색 추출</button></div><label>색상 <input id="color" type="color" value="#7056ec"></label><div id="swatches" class="swatches"></div><label>굵기 <span id="sz">8</span>px<input id="size" type="range" min="1" max="80" value="8"></label><label><input id="solid" type="checkbox"> 도형 채우기</label><h2>캔버스 크기</h2><label>가로 <input id="w" type="number" value="1000" min="50" max="3000"> 세로 <input id="h" type="number" value="650" min="50" max="3000"></label><button id="resize">크기 변경</button></aside><main class="main"><div class="panel actions"><button id="undo">↶ 되돌리기</button><button id="redo">↷ 다시 실행</button><button id="clear">🗑 지우기</button><button id="load">🖼 이미지 열기</button><button id="insert" class="primary">➕ 이미지 삽입</button><button id="save" class="primary">⬇ PNG 저장</button><input type="file" accept="image/*" id="file" hidden><input type="file" accept="image/*" id="insertFile" hidden></div><div id="insertControls" class="panel" style="display:none;margin-bottom:12px"><div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px"><label style="margin:0">이미지 크기 <input id="insertScale" type="range" min="10" max="200" value="100"></label><span id="insertScaleLabel">100%</span><button id="insertApply" class="primary">✓ 삽입 확정</button><button id="insertCancel">취소</button></div><p class="hint">이미지를 캔버스 위에서 드래그해 위치를 정한 다음 ‘삽입 확정’을 누르세요.</p></div><div class="stage"><canvas width="1000" height="650" id="canvas" aria-label="그림 그리기 영역"></canvas></div><p class="hint">마우스·터치 지원 | Ctrl+Z 되돌리기 · Ctrl+Y 다시 실행 | 자동 임시 저장 (브라우저 기기 내)</p></main></div><script>
(()=>{const $=id=>document.getElementById(id),c=$('canvas'),g=c.getContext('2d',{willReadFrequently:true});let tool='pen',down=false,start,backup,states=[],index=-1,timer;const color=()=>$('color').value,size=()=>+$('size').value;g.fillStyle='white';g.fillRect(0,0,c.width,c.height);
function checkpoint(){states.splice(index+1);states.push(c.toDataURL());if(states.length>25)states.shift();index=states.length-1;clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem('formwheel-paint-draft',states[index]);}catch(e){}},700)}
function restore(s){const im=new Image();im.onload=()=>{g.clearRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height)};im.src=s}
function change(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t))}
$('tools').onclick=e=>{const b=e.target.closest('[data-tool]');if(b)change(b.dataset.tool)};$('size').oninput=()=>{$('sz').textContent=size()};
'#111827 #ffffff #ff4060 #ff9b42 #ffe45c #43d485 #38bdf8 #7056ec #d764ad #956545 #64748b #212c7c'.split(' ').forEach(x=>{const b=document.createElement('button');b.style.background=x;b.title=x;b.setAttribute('aria-label','색상 '+x);b.onclick=()=>{$('color').value=x};$('swatches').append(b)});
function at(e){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(c.width,(e.clientX-r.left)*c.width/r.width)),y:Math.max(0,Math.min(c.height,(e.clientY-r.top)*c.height/r.height))}}
function style(){g.lineWidth=size();g.lineCap='round';g.lineJoin='round';g.strokeStyle=tool==='eraser'?'white':color();g.fillStyle=color()}
function shape(a,b){style();g.beginPath();if(tool==='line'){g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}else if(tool==='rect'){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y);$('solid').checked?g.fillRect(x,y,w,h):g.strokeRect(x,y,w,h)}else if(tool==='circle'){g.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(.01,Math.abs(b.x-a.x)/2),Math.max(.01,Math.abs(b.y-a.y)/2),0,0,Math.PI*2);$('solid').checked?g.fill():g.stroke()}}
function fill(p){const w=c.width,h=c.height,x=Math.min(w-1,p.x|0),y=Math.min(h-1,p.y|0),im=g.getImageData(0,0,w,h),d=im.data,n=(y*w+x)*4,old=Array.from(d.slice(n,n+4)),s=color(),next=[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16),255];if(old.every((v,i)=>v===next[i]))return;const q=[y*w+x],seen=new Uint8Array(w*h);while(q.length){const k=q.pop();if(seen[k])continue;seen[k]=1;const j=k*4;if(d[j]!==old[0]||d[j+1]!==old[1]||d[j+2]!==old[2]||d[j+3]!==old[3])continue;d.set(next,j);if(k%w)q.push(k-1);if(k%w<w-1)q.push(k+1);if(k>=w)q.push(k-w);if(k<w*(h-1))q.push(k+w)}g.putImageData(im,0,0)}
c.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const p=at(e);if(tool==='fill'){fill(p);checkpoint();return}if(tool==='pick'){const d=g.getImageData(Math.min(c.width-1,p.x|0),Math.min(c.height-1,p.y|0),1,1).data;$('color').value='#'+Array.from(d.slice(0,3)).map(v=>v.toString(16).padStart(2,'0')).join('');change('pen');return}if(tool==='text'){const s=prompt('넣을 글자를 입력하세요');if(s){style();g.font=Math.max(14,size()*4)+'px sans-serif';g.fillText(s,p.x,p.y);checkpoint()}return}down=true;start=p;backup=g.getImageData(0,0,c.width,c.height);c.setPointerCapture(e.pointerId);if(['pen','eraser'].includes(tool)){style();g.fillStyle=tool==='eraser'?'white':color();g.beginPath();g.arc(p.x,p.y,size()/2,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(p.x,p.y)}};
c.onpointermove=e=>{if(!down)return;const p=at(e);if(tool==='pen'||tool==='eraser'){style();g.lineTo(p.x,p.y);g.stroke();g.beginPath();g.moveTo(p.x,p.y)}else{g.putImageData(backup,0,0);shape(start,p)}};c.onpointerup=()=>{if(down){down=false;checkpoint()}};c.onpointercancel=()=>{if(down)g.putImageData(backup,0,0);down=false};
$('undo').onclick=()=>{if(index>0)restore(states[--index])};$('redo').onclick=()=>{if(index<states.length-1)restore(states[++index])};$('clear').onclick=()=>{if(confirm('전체 그림을 지울까요?')){g.fillStyle='white';g.fillRect(0,0,c.width,c.height);checkpoint()}};
$('resize').onclick=()=>{const w=+$('w').value,h=+$('h').value;if(!Number.isInteger(w)||!Number.isInteger(h)||w<50||w>3000||h<50||h>3000){alert('50~3000 사이의 크기를 입력하세요');return}const old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=w;c.height=h;g.fillStyle='white';g.fillRect(0,0,w,h);g.drawImage(old,0,0);states=[];index=-1;checkpoint()};
$('save').onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='Formwheel-Paint.png';a.click()};$('load').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{g.fillStyle='white';g.fillRect(0,0,c.width,c.height);const scale=Math.min(c.width/im.width,c.height/im.height),w=im.width*scale,h=im.height*scale;g.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);checkpoint();URL.revokeObjectURL(url)};im.src=url;e.target.value=''};

let pending=null, insertedBase=null;
function previewInsert(){
 if(!pending||!insertedBase)return;
 g.putImageData(insertedBase,0,0);
 const w=pending.baseW*(+$('insertScale').value/100),h=pending.baseH*(+$('insertScale').value/100);
 pending.w=w;pending.h=h;
 g.drawImage(pending.image,pending.x,pending.y,w,h);
 g.save();g.strokeStyle='#6953db';g.lineWidth=Math.max(2,c.width/500);g.setLineDash([10,6]);g.strokeRect(pending.x,pending.y,w,h);g.restore();
 $('insertScaleLabel').textContent=$('insertScale').value+'%';
}
function cancelInsert(){if(pending&&insertedBase)g.putImageData(insertedBase,0,0);pending=null;insertedBase=null;$('insertControls').style.display='none'}
$('insert').onclick=()=>$('insertFile').click();
$('insertFile').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!f.type.startsWith('image/')){alert('이미지 파일을 선택하세요.');return}
 cancelInsert();
 const url=URL.createObjectURL(f),image=new Image();
 image.onload=()=>{
  URL.revokeObjectURL(url);
  insertedBase=g.getImageData(0,0,c.width,c.height);
  const fit=Math.min(c.width*.65/image.width,c.height*.65/image.height,1);
  const baseW=Math.max(1,image.width*fit),baseH=Math.max(1,image.height*fit);
  pending={image,baseW,baseH,x:(c.width-baseW)/2,y:(c.height-baseH)/2,w:baseW,h:baseH};
  $('insertScale').value='100';$('insertControls').style.display='block';previewInsert();
 };
 image.onerror=()=>{URL.revokeObjectURL(url);alert('이미지를 읽지 못했어요.')};image.src=url;
};
$('insertScale').oninput=previewInsert;
$('insertCancel').onclick=cancelInsert;
$('insertApply').onclick=()=>{
 if(!pending)return;
 g.putImageData(insertedBase,0,0);
 g.drawImage(pending.image,pending.x,pending.y,pending.w,pending.h);
 pending=null;insertedBase=null;$('insertControls').style.display='none';checkpoint();
};
let insertDragging=false,insertOffset={x:0,y:0};
c.addEventListener('pointerdown',e=>{
 if(!pending)return;
 e.stopImmediatePropagation();e.preventDefault();
 const p=at(e);insertDragging=true;insertOffset={x:p.x-pending.x,y:p.y-pending.y};c.setPointerCapture(e.pointerId);
},{capture:true});
c.addEventListener('pointermove',e=>{
 if(!pending)return;
 e.stopImmediatePropagation();
 if(!insertDragging)return;
 const p=at(e);pending.x=p.x-insertOffset.x;pending.y=p.y-insertOffset.y;previewInsert();
},{capture:true});
for(const eventName of ['pointerup','pointercancel'])c.addEventListener(eventName,e=>{
 if(!pending)return;e.stopImmediatePropagation();insertDragging=false;
},{capture:true});
for(const id of ['undo','redo','clear','resize','load','save'])$(id).addEventListener('click',()=>{if(pending)cancelInsert()},{capture:true});

document.onkeydown=e=>{if(e.target.matches('input,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redo').click()}};try{const s=localStorage.getItem('formwheel-paint-draft');if(s){const im=new Image();im.onload=()=>{g.drawImage(im,0,0,c.width,c.height);checkpoint()};im.src=s}else checkpoint()}catch(e){checkpoint()}
})();
</script><script>
/* Secol Random 9 - additive tools */
document.addEventListener('DOMContentLoaded',()=>{
const c=document.getElementById('canvas'),color=document.getElementById('color'),size=document.getElementById('size')||document.getElementById('sz');if(!c)return;
const bar=document.createElement('section');bar.style.cssText='display:flex;flex-wrap:wrap;gap:7px;padding:10px;background:#222a46;border-radius:12px;margin:12px';
bar.innerHTML='<b style="width:100%">🎲 Secol 도구 확장</b><button id="sr9paintRandom" type="button">🎨 랜덤 색상</button><button id="sr9paintPalette" type="button">🌈 팔레트 5색</button><button id="sr9paintGrid" type="button">🔲 격자 표시</button><button id="sr9paintChallenge" type="button">🎯 오늘의 그림 주제</button><span id="sr9paintInfo" role="status" style="align-self:center"></span>';
c.parentElement.before(bar);
const info=document.getElementById('sr9paintInfo');const randomColor=()=>{const b=crypto.getRandomValues(new Uint8Array(3));return '#'+[...b].map(v=>v.toString(16).padStart(2,'0')).join('')};
document.getElementById('sr9paintRandom').onclick=()=>{if(color){color.value=randomColor();color.dispatchEvent(new Event('input',{bubbles:true}));info.textContent='색상 '+color.value}};
document.getElementById('sr9paintPalette').onclick=()=>{let wrap=document.getElementById('sr9paintColors');if(wrap){wrap.remove();return}wrap=document.createElement('div');wrap.id='sr9paintColors';wrap.style.cssText='display:flex;gap:5px;width:100%';for(let i=0;i<5;i++){const b=document.createElement('button');b.type='button';const clr=randomColor();b.style.cssText='background:'+clr+';width:40px;height:36px';b.title=clr;b.onclick=()=>{if(color){color.value=clr;color.dispatchEvent(new Event('input',{bubbles:true}))}};wrap.append(b)}bar.append(wrap)};
let grid=null;document.getElementById('sr9paintGrid').onclick=()=>{if(grid){grid.remove();grid=null;return}const parent=c.parentElement;const style=getComputedStyle(parent);if(style.position==='static')parent.style.position='relative';grid=document.createElement('div');grid.style.cssText='position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#9995 1px,transparent 1px),linear-gradient(to bottom,#9995 1px,transparent 1px);background-size:25px 25px';parent.append(grid)};
const topics=['나만의 마스코트','우주 도시','비 오는 학교','미래의 자동차','동화 속 동물','마법의 문','나만의 게임 아이콘'];document.getElementById('sr9paintChallenge').onclick=()=>{info.textContent='🎯 '+topics[Math.floor(Math.random()*topics.length)]};
});
</script><script>
/* Secol Random 10 */
document.addEventListener("DOMContentLoaded",()=>{const area=document.createElement("div");area.style.cssText="padding:10px;margin:10px;border:1px solid #7c86b4;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap";area.innerHTML='<b style="width:100%">🎉 랜덤 개선 10탄</b><button id="sr10paintTheme" type="button">🎨 추천 색 조합</button><button id="sr10paintTimer" type="button">⏱️ 60초 챌린지</button><button id="sr10paintIdea" type="button">💡 그림 제목 추천</button><span id="sr10paintMessage" role="status"></span>';if(document.querySelector("main"))document.querySelector("main").prepend(area);else document.body.prepend(area);const msg=document.getElementById("sr10paintMessage");const random=a=>a[Math.floor(Math.random()*a.length)];document.getElementById("sr10paintTheme").onclick=()=>{msg.textContent="추천 팔레트: "+random(["보라+노랑+흰색","민트+남색+분홍","주황+청록+검정","하늘색+연보라+아이보리"])};let timer;document.getElementById("sr10paintTimer").onclick=()=>{clearInterval(timer);let sec=60;msg.textContent="60초 시작!";timer=setInterval(()=>{sec--;msg.textContent=sec?"⏱️ 남은 "+sec+"초":"🎉 챌린지 종료!";if(!sec)clearInterval(timer)},1000)};document.getElementById("sr10paintIdea").onclick=()=>{msg.textContent="제목: "+random(["작은 우주의 비밀","미래의 문","반짝이는 하루","꿈속의 모험","오늘의 색"])};});
</script>
</body></html>
